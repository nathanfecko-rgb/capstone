
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Central | Teams</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body data-page="teams">
<nav class="navbar navbar-expand-lg site-nav sticky-top">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-trophy-fill"></i> Sports <span>Central</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link" data-nav="home" href="index.html">Home</a>
      <a class="nav-link" data-nav="baseball" href="baseball.html">Baseball</a>
      <a class="nav-link" data-nav="basketball" href="basketball.html">Basketball</a>
      <a class="nav-link" data-nav="teams" href="teams.html">Teams</a>
      <button class="theme-toggle ms-lg-3" id="themeToggle" type="button"><i class="bi bi-moon-stars-fill"></i> Dark Mode</button>
    </div></div>
  </div>
</nav>

<header class="page-banner"><div class="container">
  <span class="eyebrow">THE COMPLETE DIRECTORY</span>
  <h1>Find Your <span>Team.</span></h1>
  <p>All 30 MLB teams and all 30 NBA teams in one place.</p>
</div></header>

<main class="container section-space">
  <div class="team-controls">
    <label class="search-box"><i class="bi bi-search"></i><input id="teamSearch" type="search" placeholder="Search teams or cities..." aria-label="Search teams"></label>
    <div class="filter-buttons" role="group" aria-label="Filter teams">
      <button class="filter-btn active" data-filter="all" type="button">All Teams (60)</button>
      <button class="filter-btn" data-filter="MLB" type="button">MLB (30)</button>
      <button class="filter-btn" data-filter="NBA" type="button">NBA (30)</button>
      <button class="filter-btn" data-filter="favorites" type="button"><i class="bi bi-heart-fill"></i> Favorites</button>
    </div>
  </div>
  <p id="teamCount" class="team-count">Loading teams...</p>
  <div id="teamGrid" class="row g-4"></div>
  <p id="noTeams" class="empty-message d-none">No teams found. Try another search or filter.</p>
</main>

<footer class="site-footer"><div class="container footer-content"><a class="footer-brand" href="index.html"><i class="bi bi-trophy-fill"></i> Sports Central</a><p>Find your team. Follow your sport.</p><span>© <span id="year"></span> Sports Central</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
